name: Update CadenceProficiency Submodule Pointer

on:
  push:
    branches:
      - main

jobs:
  update-submodule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CadenceProficiency
        uses: actions/checkout@v4
        with:
          repository: TheVoltageVikingRam/CadenceProficiency
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: true

      - name: Update submodule pointer
        run: |
          git submodule update --remote 1.Analog_IPs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 1.Analog_IPs
          git diff --staged --quiet || git commit -m "chore: auto-update Analog_IPs submodule to latest HEAD"

      - name: Push to CadenceProficiency
        run: git push origin main
